:root {
  --primary: #b8932a;
  --dark: #1a1a1a;
  --light: #f5f5f0;
  --accent-teal: #2d5f6f;
  --accent-maroon: #5a2e3e;
  --border: #333;
}

body {
  font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, var(--dark) 0%, #0d0d0d 100%);
  color: var(--light);
  min-height: 100vh;
  padding: 20px;
  position: relative;
  overflow-x: hidden;
}

/* Grain overlay */
body::before {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-image: 
    url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' result='noise' /%3E%3C/filter%3E%3Crect width='400' height='400' fill='%23000' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 1;
}

.container {
  max-width: 1000px;
  margin: 0 auto;
  position: relative;
  z-index: 2;
}

header {
  text-align: center;
  margin-bottom: 50px;
  animation: fadeInDown 0.8s ease;
}

h1 {
  font-size: 42px;
  font-weight: 700;
  letter-spacing: -1px;
  margin-bottom: 8px;
  color: var(--primary);
}

.subtitle {
  font-size: 14px;
  color: #999;
  text-transform: uppercase;
  letter-spacing: 2px;
}

.content-wrapper {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 40px;
  margin-bottom: 60px;
}

.form-section {
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--border);
  padding: 32px;
  border-radius: 8px;
  backdrop-filter: blur(10px);
  animation: fadeInUp 0.8s ease 0.2s both;
}

.form-group {
  margin-bottom: 24px;
}

label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 8px;
  color: var(--primary);
}

input, textarea, select {
  width: 100%;
  padding: 12px 16px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(184, 147, 42, 0.3);
  border-radius: 4px;
  color: var(--light);
  font-family: inherit;
  font-size: 13px;
  transition: all 0.3s;
}

input:focus, textarea:focus, select:focus {
  outline: none;
  border-color: var(--primary);
  background: rgba(255, 255, 255, 0.08);
  box-shadow: 0 0 0 3px rgba(184, 147, 42, 0.1);
}

textarea {
  resize: vertical;
  min-height: 120px;
  font-family: 'Space Mono', monospace;
  font-size: 12px;
}

.color-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 10px;
}

.color-option {
  aspect-ratio: 1;
  border-radius: 4px;
  cursor: pointer;
  border: 2px solid transparent;
  transition: all 0.2s;
  opacity: 0.6;
}

.color-option:hover {
  opacity: 1;
}

.color-option.active {
  border-color: var(--light);
  opacity: 1;
  box-shadow: 0 0 12px rgba(184, 147, 42, 0.4);
}

.btn {
  background: linear-gradient(135deg, var(--primary) 0%, #d4a843 100%);
  color: var(--dark);
  border: none;
  padding: 14px 32px;
  font-size: 13px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.3s;
  width: 100%;
  margin-top: 12px;
}

.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 24px rgba(184, 147, 42, 0.3);
}

.btn:active {
  transform: translateY(0);
}

.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.preview-section {
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--border);
  padding: 32px;
  border-radius: 8px;
  backdrop-filter: blur(10px);
  animation: fadeInUp 0.8s ease 0.4s both;
}

.preview-section h2 {
  font-size: 18px;
  margin-bottom: 20px;
  color: var(--primary);
}

.pdf-list {
  max-height: 400px;
  overflow-y: auto;
}

.pdf-item {
  background: rgba(255, 255, 255, 0.05);
  padding: 16px;
  margin-bottom: 12px;
  border-radius: 4px;
  border-left: 3px solid var(--primary);
  display: flex;
  justify-content: space-between;
  align-items: center;
  animation: slideIn 0.3s ease;
}

.pdf-item-name {
  font-size: 12px;
  color: var(--light);
  word-break: break-all;
}

.pdf-item-actions {
  display: flex;
  gap: 8px;
}

.pdf-btn {
  padding: 6px 12px;
  background: rgba(184, 147, 42, 0.2);
  border: 1px solid var(--primary);
  color: var(--primary);
  border-radius: 3px;
  cursor: pointer;
  font-size: 11px;
  transition: all 0.2s;
}

.pdf-btn:hover {
  background: rgba(184, 147, 42, 0.3);
}

.status {
  padding: 16px;
  border-radius: 4px;
  margin-bottom: 16px;
  font-size: 13px;
  display: none;
}

.status.show {
  display: block;
}

.status.success {
  background: rgba(76, 175, 80, 0.2);
  border: 1px solid rgba(76, 175, 80, 0.4);
  color: #81c784;
}

.status.error {
  background: rgba(244, 67, 54, 0.2);
  border: 1px solid rgba(244, 67, 54, 0.4);
  color: #ef5350;
}

.status.loading {
  background: rgba(184, 147, 42, 0.2);
  border: 1px solid rgba(184, 147, 42, 0.4);
  color: var(--primary);
}

@keyframes fadeInDown {
  from {
    opacity: 0;
    transform: translateY(-20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes slideIn {
  from {
    opacity: 0;
    transform: translateX(-20px);
  }
  to {
    opacity: 1;
    transform: translateX(0);
  }
}

@media (max-width: 768px) {
  .content-wrapper {
    grid-template-columns: 1fr;
    gap: 20px;
  }

  h1 {
    font-size: 28px;
  }

  .form-section, .preview-section {
    padding: 20px;
  }
}

  </div>

  <script>
    let selectedColor = 'darkGold';

    // Color selection
    document.querySelectorAll('.color-option').forEach((btn) => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.color-option').forEach((b) => b.classList.remove('active'));
        this.classList.add('active');
        selectedColor = this.dataset.color;
      });
    });

    // Generate PDF
    document.getElementById('generateBtn').addEventListener('click', async () => {
      const title = document.getElementById('title').value.trim();
      const content = document.getElementById('content').value.trim();
      const author = document.getElementById('author').value.trim();
      const status = document.getElementById('status');

      if (!title || !content) {
        showStatus('Please fill in title and content', 'error');
        return;
      }

      showStatus('Generating PDF...', 'loading');
      document.getElementById('generateBtn').disabled = true;

      try {
        const response = await fetch('/api/generate-pdf', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, content, author, color: selectedColor }),
        });

        const data = await response.json();

        if (data.success) {
          showStatus(`PDF created: ${data.filename}`, 'success');
          document.getElementById('title').value = '';
          document.getElementById('content').value = '';
          document.getElementById('author').value = '';
          loadPDFList();
        } else {
          showStatus(data.error || 'Failed to generate PDF', 'error');
        }
      } catch (error) {
        showStatus('Error: ' + error.message, 'error');
      } finally {
        document.getElementById('generateBtn').disabled = false;
      }
    });

    // Load PDF list
    async function loadPDFList() {
      try {
        const response = await fetch('/api/pdfs');
        const pdfs = await response.json();

        const pdfList = document.getElementById('pdfList');
        if (pdfs.length === 0) {
          pdfList.innerHTML = '<p style="color: #666; font-size: 12px;">No PDFs generated yet.</p>';
          return;
        }

        pdfList.innerHTML = pdfs
          .reverse()
          .map(
            (pdf) => `
          <div class="pdf-item">
            <div class="pdf-item-name">${pdf.name}</div>
            <div class="pdf-item-actions">
              <a href="${pdf.downloadUrl}" class="pdf-btn" download>Download</a>
            </div>
          </div>
        `
          )
          .join('');
      } catch (error) {
        console.error('Failed to load PDFs:', error);
      }
    }

    function showStatus(message, type) {
      const status = document.getElementById('status');
      status.textContent = message;
      status.className = `status show ${type}`;
      setTimeout(() => {
        status.classList.remove('show');
      }, 5000);
    }

    // Load PDFs on page load
    loadPDFList();
    setInterval(loadPDFList, 5000);
  </script>
